<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>গোল অ্যারেনা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1020;--card:#151b30;--tx:#eef2ff;--mu:#9aa6c4;--ac:#22d37a;--ac2:#00b8d9;--bd:#27304d;--ok:#22d37a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b30;--tx:#eef2ff;--mu:#9aa6c4;--ac:#22d37a;--ac2:#00b8d9;--bd:#27304d;--ok:#22d37a}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b30;--tx:#eef2ff;--mu:#9aa6c4;--ac:#22d37a;--ac2:#00b8d9;--bd:#27304d;--ok:#22d37a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:16px}
header{position:relative;padding:20px 58px 16px;text-align:center;background:#8f1d1d;color:#fff}
header h1{margin:0;font-size:24px;font-weight:700;line-height:1.25}header p{margin:4px 0 0;opacity:.9;font-size:14px}.dl,.dr{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:30px;line-height:1.1}.dl{left:8px}.dr{right:8px}.dl svg,.dr svg{width:32px;height:32px;stroke:#ffd54a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:6px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:#04210f;border-color:var(--ac)}
main{padding:4px 12px 40px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}
label{display:block;margin:4px 0 3px}
.fr{display:flex;gap:6px;align-items:center;margin-bottom:8px}.fr input{margin:0;flex:1;min-width:0}
input[readonly],textarea[readonly]{opacity:.7}
.ed{border-color:var(--ac)!important;opacity:1!important}
.btn.eb{border:1.5px solid var(--ac);color:var(--ac);background:transparent}
.btn.s svg{vertical-align:-3px;margin-right:4px}
.mrow{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.num{width:34px;height:34px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
input,select,textarea{width:100%;padding:11px;margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#04210f;font:inherit;font-weight:600;cursor:pointer}
.btn.s{padding:6px 10px;font-size:14px}.btn.g{background:var(--ok)}.btn.r{background:#ff4d6d;color:#fff}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.mu{color:var(--mu);font-size:14px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--bd)}td:nth-child(2),th:nth-child(2){text-align:left}
th{color:var(--mu);font-size:13px}.top td{font-weight:700;color:var(--ac)}
.br{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}.col{min-width:150px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.col h3{margin:0;font-size:13px;color:var(--mu);text-align:center}
.m{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.m div{padding:8px 10px;font-size:14px;border-bottom:1px solid var(--bd)}.m div:last-child{border:0}
.m .w{background:var(--ac);color:#04210f;font-weight:700}.m .cl{cursor:pointer}.m .e{color:var(--mu)}
.champ{text-align:center;font-size:20px;font-weight:700;padding:10px;color:var(--ac)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mu)}.tag.ok{background:var(--ok);color:#04210f}
</style>
</head>
<body>
<header><div class="dl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10"/><path d="M17 4v8a5 5 0 0 1 -10 0v-8"/><circle cx="5" cy="9" r="2"/><circle cx="19" cy="9" r="2"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z"/></svg></div><h1 id="ttl"></h1><p id="sub"></p><div class="dr"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7l4.76 3.45l-1.76 5.55h-6l-1.76 -5.55z"/><path d="M12 7v-4m3 13l2.5 3m-.74 -8.55l3.74 -1.45m-11.44 7.05l-2.56 2.95m.74 -8.55l-3.74 -1.45"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2 -2.96 0 -7 -1 -8c0 3.038 -1.773 4.741 -3 6c-1.226 1.26 -2 3.24 -2 5a6 6 0 1 0 12 0c0 -1.532 -1.056 -3.94 -2 -5c-1.786 3 -2.791 3 -4 2z"/></svg></div></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const KEY='tourney_v1';
const ADMIN_BUILD=false;
const SITE='https://aktar9274.github.io/goal-arena/';
const SCORE={'Free Fire':[12,9,8,7,6,5,4,3,2,1,0,0],'PUBG':[15,12,10,8,6,4,2,1,0,0,0,0]};
let S={game:'eFootball',name:'গোল অ্যারেনা',pin:'1234',fee:'',bk:'',ng:'',open:true,showPh:true,wa:'',room:'',ctype:'নক-আউট',fx:[],sub:'eFootball · নক-আউট',pnote:'',prize:'',rules:'',regs:[],bracket:null,pts:[]};
try{const x=localStorage.getItem(KEY);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
function applyHash(){try{if(!ADMIN_BUILD&&location.hash.indexOf('#d=')===0){const d=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));['name','fee','bk','ng','wa','open','showPh','bracket','room','sub','pnote','prize','rules','ctype','fx'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});const ids=new Set((d.regs||[]).map(r=>r.id));S.regs=S.regs.filter(r=>!r.ok&&!ids.has(r.id)).concat(d.regs||[]);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}catch(e){}}
applyHash();
S.game='eFootball';if(!S.name||S.name==='লোকাল গেমিং টুর্নামেন্ট'||S.name==='eFootball টুর্নামেন্ট')S.name='গোল অ্যারেনা';let admin=false,tab='reg',payId=null,edM=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isBr=()=>true;
const approved=()=>S.regs.filter(r=>r.ok).map(r=>r.name);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function go(t){tab=t;render()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* bracket logic */
function parts(r,i){const B=S.bracket;if(r===0)return[B.seed[2*i],B.seed[2*i+1]];return[win(r-1,2*i),win(r-1,2*i+1)]}
function win(r,i){const p=parts(r,i);if(r===0&&p[0]&&!p[1])return p[0];const w=S.bracket.w[r+'-'+i];return w&&p.includes(w)?w:null}
function genBracket(){const t=shuffle(approved());if(t.length<2){alert('কমপক্ষে ২ জন অনুমোদিত প্লেয়ার লাগবে');return}
 if(S.bracket&&!confirm('নতুন ম্যাচ তালিকা বানালে আগেরটি মুছে যাবে। ঠিক আছে?'))return;
 let size=2;while(size<t.length)size*=2;const h=size/2,seed=[];
 for(let i=0;i<h;i++){seed.push(t[i]);seed.push(t[h+i]||null)}
 S.bracket={seed,w:{}};save();render()}
function msg(p,c){return `eFootball ম্যাচ: ${p[0]} vs ${p[1]}\nরুম কোড: ${c}\nরুমে ঢুকে এখনই খেলুন।`}
function rc(r,i,p){if(!p[0]||!p[1])return'';const c=((S.bracket.rc||{})[r+'-'+i]);let h='';
 if(c&&!admin)h+=`<div style="background:var(--bg)">🔑 রুম কোড: <b>${esc(c)}</b></div>`;
 if(admin)h+=`<div style="background:var(--bg);display:flex;gap:6px;align-items:center"><input id="mc${r}-${i}" value="${esc(c||'')}" placeholder="রুম কোড" oninput="setRc(${r},${i})" style="margin:0;padding:6px 8px;flex:1;min-width:0"><a id="ms${r}-${i}" class="btn s g" style="text-decoration:none" target="_blank" rel="noopener" href="${mHref(p,c)}">শেয়ার</a></div>`;
 return h}
function mHref(p,c){return 'https://wa.me/?text='+encodeURIComponent(msg(p,c||''))}
function setRc(r,i){const k=r+'-'+i,v=$('mc'+k).value.trim();S.bracket.rc=S.bracket.rc||{};S.bracket.rc[k]=v||undefined;save();$('ms'+k).href=mHref(parts(r,i),v)}
function vPay(){const r=S.regs.find(x=>x.id===payId);if(!r){tab='reg';return vReg()}
 const num=(l,v)=>v?`<div class="row"><span>${l}</span><b style="font-size:18px">${esc(v)}</b></div>`:'';
 return `<div class="card"><h2>পেমেন্ট করুন</h2><p>ধন্যবাদ, <b>${esc(r.name)}</b>! নিচের নম্বরে এন্ট্রি ফি পাঠান, তারপর ট্রান্সজেকশন আইডি দিন।</p>${S.fee?`<div class="row"><span>এন্ট্রি ফি</span><b style="font-size:18px">৳ ${esc(S.fee)}</b></div>`:''}${num('বিকাশ নম্বর',S.bk)}${num('নগদ নম্বর',S.ng)}${S.bk||S.ng?'':'<p class="mu">অ্যাডমিন এখনো পেমেন্ট নম্বর দেননি।</p>'}${S.pnote?`<p class="mu" style="white-space:pre-wrap;margin-top:8px">${esc(S.pnote)}</p>`:''}<input id="tx" oninput="payUp()" placeholder="ট্রান্সজেকশন আইডি (TrxID)" value="${esc(r.trx||'')}"><a id="pa" class="btn" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${payHref(r)}" onclick="return saveTrx()">পেমেন্ট করেছি, অ্যাডমিনকে জানান</a></div><p class="mu" style="text-align:center">অ্যাডমিন যাচাই করে অনুমোদন দিলে আপনার নামের পাশে ✅ আসবে, তারপর রুম কোড পাবেন।</p>`}
function tg(k){S[k]=!S[k];save();render()}
function addMan(){const n=$('mn').value.trim(),u='',p=$('mp').value.trim();if(!n){alert('নাম দিন');return}if(S.regs.some(r=>r.name.toLowerCase()===n.toLowerCase())){alert('এই নামে আগেই আছে');return}S.regs.push({id:Date.now(),name:n,uid:u,phone:p,ok:true});save();render()}
function delBr(){if(confirm('ম্যাচ তালিকা মুছে ফেলবেন?')){S.bracket=null;save();render()}}
function helpBox(){if(!S.wa)return '';return `<div class="card"><h2>💬 কাস্টমার সার্ভিস</h2><p class="mu">কোনো সমস্যা হলে এখানে লিখুন, মেসেজ হোয়াটসঅ্যাপে সরাসরি অ্যাডমিনের কাছে যাবে।</p><textarea id="hm" oninput="hlUp()" rows="3" placeholder="আপনার সমস্যা লিখুন" style="width:100%;padding:11px;margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit"></textarea><a id="hl" class="btn" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${hlHref('')}">হোয়াটসঅ্যাপে পাঠান</a></div>`}
function waLink(r){const t=`হ্যালো ${r.name}! আপনার eFootball ম্যাচের রুম কোড: ${r.rc||''}\nএখনই রুমে ঢুকে খেলুন।`;return 'https://wa.me/'+waNum(r.phone)+'?text='+encodeURIComponent(t)}
function rcUp(id){const r=S.regs.find(x=>x.id===id);r.rc=$('rc'+id).value.trim();save();$('ra'+id).href=waLink(r)}
function hlHref(m){return 'https://wa.me/'+waNum(S.wa)+'?text='+encodeURIComponent('গোল অ্যারেনা - সাহায্য:\n'+m)}
function hlUp(){$('hl').href=hlHref($('hm').value.trim())}
function payMsg(r){return 'গোল অ্যারেনা - নতুন রেজিস্ট্রেশন\nনাম: '+r.name+'\nনম্বর: '+r.phone+'\nTrxID: '+(r.trx||'')}
function payHref(r){return S.wa?'https://wa.me/'+waNum(S.wa)+'?text='+encodeURIComponent(payMsg(r)):'#'}
function payUp(){const r=S.regs.find(x=>x.id===payId);r.trx=$('tx').value.trim();save();$('pa').href=payHref(r)}
function saveTrx(){const r=S.regs.find(x=>x.id===payId);r.trx=$('tx').value.trim();save();if(!S.wa){alert('অ্যাডমিনের হোয়াটসঅ্যাপ নম্বর পাওয়া যায়নি। অ্যাডমিনকে সরাসরি জানান।');return false}setTimeout(()=>go('reg'),400);return true}
function shareLink(w){const d={room:w?S.room:'',sub:S.sub,pnote:S.pnote,prize:S.prize,rules:S.rules,ctype:S.ctype,fx:S.fx,name:S.name,fee:S.fee,bk:S.bk,ng:S.ng,wa:S.wa,open:S.open,showPh:S.showPh,regs:S.regs.filter(r=>r.ok).map(r=>({id:r.id,name:r.name,uid:r.uid,phone:S.showPh?r.phone:'',ok:true})),bracket:S.bracket};return SITE+'#d='+btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function cpLink(id){const e=$(id||'lk');try{navigator.clipboard.writeText(e.value).then(()=>alert('লিংক কপি হয়েছে'),()=>{e.select()})}catch(x){e.select()}}
const PEN='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',DSK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>';
function fld(label,key,kind){const v=esc(S[key]||''),b=`<button class="btn s eb" onclick="fEdit('${key}')">${PEN}এডিট</button><button class="btn s" id="sv_${key}" onclick="fSave('${key}')">${DSK}সেভ</button>`;
 if(kind==='t')return `<label class="mu">${label}</label><textarea id="f_${key}" rows="${key==='rules'?4:2}" readonly>${v}</textarea><div class="fr" style="justify-content:flex-end">${b}</div>`;
 return `<label class="mu">${label}</label><div class="fr"><input id="f_${key}" value="${v}" readonly${kind==='n'?' inputmode="tel"':''}>${b}</div>`}
function fEdit(k){const e=$('f_'+k);e.readOnly=false;e.className='ed';e.focus()}
function fSave(k){const e=$('f_'+k);S[k]=e.value.trim();save();render();const b=$('sv_'+k);if(b){b.textContent='সেভ হয়েছে ✓';setTimeout(()=>{const c=$('sv_'+k);if(c)c.innerHTML=DSK+'সেভ'},1500)}}
function mxRow(m,i){if(edM===m.id)return `<div class="mrow" style="flex-direction:column;align-items:stretch"><input id="ma${m.id}" value="${esc(m.a)}" placeholder="প্রথম প্লেয়ার বা টিম"><input id="mb${m.id}" value="${esc(m.b)}" placeholder="দ্বিতীয় প্লেয়ার বা টিম"><input id="md${m.id}" value="${esc(m.dt)}" placeholder="তারিখ ও সময় (যেমন: 12 অক্টোবর 2026 · রাত 8:00)"><div class="fr" style="justify-content:flex-end;margin:0"><button class="btn s r" onclick="mxDel(${m.id})">মুছুন</button><button class="btn s" onclick="mxSave(${m.id})">${DSK}সেভ</button></div></div>`;
 return `<div class="mrow"><span class="num">${i+1}</span><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(m.a)} vs ${esc(m.b)}</div><div class="mu">${esc(m.dt)}</div></div><button class="btn s eb" onclick="mxEdit(${m.id})">${PEN}এডিট</button><button class="btn s" disabled style="opacity:.45">${DSK}সেভ</button></div>`}
function mxCard(){const l=S.fx||[];return `<div class="card"><h2>⚽ ম্যাচ ম্যানেজমেন্ট</h2><p class="mu">এখান থেকে ম্যাচ যোগ, এডিট বা মুছে ফেলতে পারবেন। প্লেয়াররা এগুলো ম্যাচ তালিকায় দেখবে।</p>${l.map(mxRow).join('')||'<p class="mu">এখনো কোনো ম্যাচ নেই</p>'}<button class="btn" onclick="mxAdd()">+ ম্যাচ যোগ করুন</button></div>`}
function mxAdd(){const m={id:Date.now()*1000+Math.floor(Math.random()*1000),a:'',b:'',dt:''};S.fx=(S.fx||[]).concat([m]);edM=m.id;save();render()}
function mxEdit(id){edM=id;render()}
function mxSave(id){const m=S.fx.find(x=>x.id===id);m.a=$('ma'+id).value.trim();m.b=$('mb'+id).value.trim();m.dt=$('md'+id).value.trim();edM=null;save();render()}
function mxDel(id){if(!confirm('এই ম্যাচ মুছে ফেলবেন?'))return;S.fx=S.fx.filter(x=>x.id!==id);edM=null;save();render()}
function fxCard(){const l=S.fx||[];if(!l.length&&!S.ctype)return '';return `<div class="card"><h2>⚽ ম্যাচ সূচি</h2>${S.ctype?`<div class="mu" style="margin-bottom:8px">প্রতিযোগিতার ধরন: ${esc(S.ctype)}</div>`:''}${l.map((m,i)=>`<div class="mrow"><span class="num">${i+1}</span><div><div style="font-weight:600">${esc(m.a)} vs ${esc(m.b)}</div><div class="mu">${esc(m.dt)}</div></div></div>`).join('')}</div>`}
function lkUp(){const l=shareLink(true);$('lk2').value=l;if($('ol2'))$('ol2').href=l;$('wl2').href='https://wa.me/?text='+encodeURIComponent(l)}
function infoCards(){const b=(t,v)=>v?`<div class="card"><h2>${t}</h2><p style="margin:0;white-space:pre-wrap">${esc(v)}</p></div>`:'';return b('পুরস্কার',S.prize)+b('নিয়মাবলী',S.rules)}
function statusCard(){if(ADMIN_BUILD||!S.me)return '';const r=S.regs.find(x=>x.id===S.me);if(!r)return '';const nm=r.name.trim().toLowerCase();const ok=r.ok||S.regs.some(x=>x.ok&&x.name.trim().toLowerCase()===nm);
 return ok?`<div class="card" style="border-color:var(--ok)"><b>✅ ${esc(r.name)}, আপনি অনুমোদিত!</b><p class="mu" style="margin:6px 0 0">ম্যাচের সময় অ্যাডমিন আপনাকে রুম কোড দেবে।</p></div>`:`<div class="card" style="border-color:#e0a82e"><b>⏳ ${esc(r.name)}, আপনার রেজিস্ট্রেশন অপেক্ষমাণ</b><p class="mu" style="margin:6px 0 8px">অ্যাডমিন পেমেন্ট যাচাই করে অনুমোদন দিলে এখানে ✅ আসবে। অ্যাডমিনের পাঠানো নতুন লিংক খুলে দেখুন।</p><button class="btn s o" onclick="payId=${r.id};go('pay')">পেমেন্ট পেজ</button></div>`}

 const g='<svg viewBox="0 0 300 190" style="width:100%;max-width:340px;height:auto" role="img" aria-label="গোলকিপার"><rect x="0" y="168" width="300" height="22" fill="#0f3a24"/><g stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5"><path d="M40 70H260M40 90H260M40 110H260M40 130H260M40 150H260M70 48V168M100 48V168M130 48V168M160 48V168M190 48V168M220 48V168M250 48V168"/></g><path d="M38 168V48H262V168" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><g stroke-linecap="round"><path d="M132 94L92 66M168 94L208 66" stroke="#22d37a" stroke-width="12"/><path d="M144 146L136 172M156 146L164 172" stroke="#e8b992" stroke-width="10"/></g><rect x="130" y="82" width="40" height="48" rx="10" fill="#22d37a"/><rect x="132" y="126" width="36" height="22" rx="5" fill="#151b30"/><circle cx="150" cy="66" r="13" fill="#e8b992"/><path d="M137 62q13-14 26 0" fill="#2a1a10"/><circle cx="88" cy="62" r="11" fill="#ffd54a"/><circle cx="212" cy="62" r="11" fill="#ffd54a"/><rect x="128" y="170" width="16" height="6" rx="3" fill="#eef2ff"/><rect x="156" y="170" width="16" height="6" rx="3" fill="#eef2ff"/><circle cx="238" cy="160" r="12" fill="#fff" stroke="#0b1020" stroke-width="2"/><path d="M238 153l6 4-2 7h-8l-2-7z" fill="#0b1020"/></svg>';
 return `<div class="card" style="text-align:center">${g}<p style="margin:6px 0 10px">ম্যাচ তালিকা দেখতে আগে রেজিস্ট্রেশন করুন।</p><button class="btn" onclick="go('reg')">রেজিস্ট্রেশন করুন</button></div>`}
function roomCard(){return S.room?`<div class="card" style="text-align:center"><div class="mu">আজকের রুম কোড</div><div style="font-size:32px;font-weight:700;letter-spacing:3px;color:var(--ac);margin:4px 0">${esc(S.room)}</div><button class="btn s o" onclick="cpRoom()">কোড কপি করুন</button></div>`:''}
function cpRoom(){try{navigator.clipboard.writeText(S.room).then(()=>alert('কোড কপি হয়েছে'))}catch(x){}}
function pasteAdd(){const t=$('pm').value;const g=k=>{const m=t.match(new RegExp(k+'\\s*[:：]\\s*([^\\n]+)'));return m?m[1].trim():''};const n=g('নাম'),u='',p=g('নম্বর'),x=g('TrxID');if(!n){alert('মেসেজে নাম পাওয়া যায়নি');return}if(S.regs.some(r=>r.name.toLowerCase()===n.toLowerCase())){alert('এই নামে আগেই আছে');return}S.regs.push({id:Date.now(),name:n,uid:u,phone:p,trx:x,ok:false});save();render()}
function waNum(p){p=String(p).replace(/\D/g,'');if(p.startsWith('880'))return p;if(p.startsWith('0'))return '88'+p;if(p.length===10&&p[0]==='1')return '880'+p;return p}
function setW(r,i,s){const n=parts(r,i)[s];if(!n)return;const k=r+'-'+i;S.bracket.w[k]=S.bracket.w[k]===n?undefined:n;save();render()}

/* registration */
function addReg(){const n=$('rn').value.trim(),u='',p=$('rp').value.trim();
 if(!n||!p){alert('নাম ও হোয়াটসঅ্যাপ নম্বর দিন');return}
 if(S.regs.some(r=>r.name.toLowerCase()===n.toLowerCase())){alert('এই নামে আগেই রেজিস্ট্রেশন হয়েছে');return}
 const id=Date.now();S.me=id;S.regs.push({id,name:n,uid:u,phone:p,ok:false});save();payId=id;tab='pay';render()}
function appr(id){const r=S.regs.find(x=>x.id===id);r.ok=!r.ok;save();render()}
function delReg(id){if(!confirm('মুছে ফেলবেন?'))return;S.regs=S.regs.filter(x=>x.id!==id);save();render()}

/* points */
function addPts(){const t=$('pt').value,p=+$('pp').value,k=+$('pk').value||0;
 if(!t||!p||p<1){alert('টিম ও পজিশন দিন');return}
 const sc=(SCORE[S.game][p-1]||0)+k;S.pts.push({id:Date.now(),team:t,place:p,kills:k,pts:sc,m:+$('pm').value||1});save();render()}
function delPts(id){S.pts=S.pts.filter(x=>x.id!==id);save();render()}
function standings(){const o={};S.pts.forEach(x=>{const e=o[x.team]=o[x.team]||{team:x.team,pts:0,kills:0,ms:new Set()};e.pts+=x.pts;e.kills+=x.kills;e.ms.add(x.m)});
 return Object.values(o).sort((a,b)=>b.pts-a.pts||b.kills-a.kills)}

/* admin */
function login(){if($('pin').value===S.pin){admin=true;S.adm=true;save();render()}else alert('ভুল পিন')}
function setMeta(){S.name=$('an').value.trim()||S.name;S.fee=$('af').value.trim();S.bk=$('ab').value.trim();S.ng=$('anm').value.trim();S.wa=$('aw').value.trim();S.sub=$('asub').value.trim();S.pnote=$('apn').value.trim();S.prize=$('apr').value.trim();S.rules=$('aru').value.trim();save();render()}
function chPin(){const p=$('np').value.trim();if(p.length<4){alert('কমপক্ষে ৪ অক্ষর');return}S.pin=p;save();alert('পিন বদলানো হয়েছে')}
function resetAll(){if(confirm('সব ডেটা (রেজিস্ট্রেশন, ফলাফল) মুছে যাবে!')){S.regs=[];S.pts=[];S.bracket=null;save();render()}}

function vReg(){const ok=S.regs.filter(r=>r.ok);
 return statusCard()+infoCards()+`${S.open?'':'<div class="card"><h2>রেজিস্ট্রেশন বন্ধ</h2><p class="mu">এই মুহূর্তে নতুন রেজিস্ট্রেশন বন্ধ আছে।</p></div>'}<div class="card" ${S.open?'':'hidden'}><h2>রেজিস্ট্রেশন</h2><input id="rn" placeholder="প্লেয়ারের নাম"><input id="rp" type="tel" placeholder="হোয়াটসঅ্যাপ নম্বর"><button class="btn" onclick="addReg()">জমা দিন</button></div>
 <div class="card"><h2>অনুমোদিত তালিকা (${ok.length})</h2>${ok.length?ok.map((r,i)=>`<div class="row"><span>${i+1}. <b>${esc(r.name)}</b>${S.showPh||admin?' · '+esc(r.phone):''}</span><span style="font-size:20px">✅</span></div>`).join(''):'<p class="mu">এখনো কেউ অনুমোদিত হয়নি</p>'}</div>`}

function vMain(){return gkCard()+statusCard()+roomCard()+fxCard()+vBr()}
function vBr(){const B=S.bracket;if(!B)return '<div class="card"><p class="mu">ম্যাচ তালিকা এখনো তৈরি হয়নি।</p></div>';
 const R=Math.log2(B.seed.length);let h='<div class="card"><div class="br">';
 for(let r=0;r<R;r++){const n=B.seed.length/Math.pow(2,r+1);h+=`<div class="col"><h3>${r===R-1?'ফাইনাল':'রাউন্ড '+(r+1)}</h3>`;
  for(let i=0;i<n;i++){const p=parts(r,i),w=win(r,i);h+='<div class="m">';
   for(let s=0;s<2;s++){const bye=r===0&&s===1&&!p[1];const can=admin&&p[s]&&!bye;
    h+=`<div class="${w&&w===p[s]?'w':''} ${can?'cl':''} ${p[s]?'':'e'}" ${can?`onclick="setW(${r},${i},${s})"`:''}>${p[s]?esc(p[s]):(bye?'বাই':'—')}</div>`}
   h+=rc(r,i,p)+'</div>'}h+='</div>'}
 const c=win(R-1,0);return h+`</div>${admin?'<p class="mu">অ্যাডমিন: বিজয়ীর নামে ট্যাপ করুন</p>':''}${c?`<div class="champ">🏆 চ্যাম্পিয়ন: ${esc(c)}</div>`:''}</div>`}
function vPts(){const st=standings();const sc=SCORE[S.game];
 return `<div class="card"><h2>পয়েন্ট টেবিল — ${S.game}</h2>${st.length?`<div class="sc"><table><tr><th>#</th><th>টিম</th><th>ম্যাচ</th><th>কিল</th><th>পয়েন্ট</th></tr>${st.map((e,i)=>`<tr class="${i<3?'top':''}"><td>${i+1}</td><td>${esc(e.team)}</td><td>${e.ms.size}</td><td>${e.kills}</td><td>${e.pts}</td></tr>`).join('')}</table></div>`:'<p class="mu">এখনো কোনো ফলাফল নেই</p>'}
 <p class="mu">পয়েন্ট = পজিশন পয়েন্ট (১ম ${sc[0]}, ২য় ${sc[1]}, ৩য় ${sc[2]}…) + প্রতি কিলে ১</p></div>`}

 const teams=approved();
 let h=`<div class="card"><h2>⚙️ টুর্নামেন্ট সেটিংস</h2><p class="mu">টুর্নামেন্টের নাম ও সাবটাইটেল পরিবর্তন করুন। পরিবর্তন করার পর সেভ করুন, তারপর নিচের লিংক থেকে নতুন লিংক প্লেয়ারদের দিন।</p>${fld('টুর্নামেন্টের নাম','name')}${fld('সাবটাইটেল','sub')}${fld('প্রতিযোগিতার ধরন','ctype')}</div>${mxCard()}<div class="card"><h2>💳 পেমেন্ট ও অন্যান্য সেটিংস</h2>${fld('এন্ট্রি ফি (টাকা)','fee','n')}${fld('বিকাশ নম্বর','bk','n')}${fld('নগদ নম্বর','ng','n')}${fld('পেমেন্টের নির্দেশনা (পেমেন্ট পেজে দেখাবে)','pnote','t')}${fld('পুরস্কার (রেজিস্ট্রেশন পেজে দেখাবে)','prize','t')}${fld('নিয়মাবলী (রেজিস্ট্রেশন পেজে দেখাবে)','rules','t')}${fld('কাস্টমার সার্ভিসের হোয়াটসঅ্যাপ নম্বর','wa','n')}<button class="btn o" onclick="tg('open')">${S.open?'রেজিস্ট্রেশন বন্ধ করুন':'রেজিস্ট্রেশন চালু করুন'}</button> <button class="btn o" style="margin-top:8px" onclick="tg('showPh')">${S.showPh?'তালিকায় নম্বর লুকান':'তালিকায় নম্বর দেখান'}</button></div><div class="card"><h2>আপনি আর যা যা করতে পারেন</h2><p class="mu" style="line-height:1.8;margin:0">• প্লেয়ার যোগ, অনুমোদন বা মুছে ফেলা<br>• রুম কোড দেওয়া ও হোয়াটসঅ্যাপে পাঠানো<br>• ম্যাচ তালিকা তৈরি, মুছে ফেলা, বিজয়ী ঠিক করা<br>• রেজিস্ট্রেশন চালু বা বন্ধ করা<br>• পিন বদলানো ও সব ডেটা মুছে নতুন করে শুরু (সবার নিচে)</p></div>
 <div class="card"><h2>আজকের রুম কোড</h2><p class="mu">eFootball-এ রুম খুলে কোডটা এখানে লিখুন। কোড শুধু নিচের "অনুমোদিত প্লেয়ারদের লিংকে" যাবে, সাধারণ লিংকে যাবে না।</p><input id="rm" value="${esc(S.room)}" placeholder="রুম কোড" oninput="S.room=this.value.trim();save();lkUp()"></div><div class="card"><h2>রেজিস্ট্রেশন লিংক (সবাইকে দিন)</h2><p class="mu">এই লিংকে ফি, নম্বর ও রেজিস্ট্রেশন ফর্ম থাকে, রুম কোড থাকে না।</p><input id="lk" readonly value="${esc(shareLink())}"><a class="btn" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareLink())}">হোয়াটসঅ্যাপে পাঠান</a> <button class="btn o" onclick="cpLink('lk')">কপি</button> <a class="btn o" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${esc(shareLink())}">খুলে দেখুন</a></div><div class="card"><h2>অনুমোদিত প্লেয়ারদের লিংক</h2><p class="mu">টাকা দেওয়া ও অনুমোদিত প্লেয়ারদেরই শুধু এই লিংক দিন। এতে রুম কোড ও ম্যাচ তালিকা থাকে। যার কাছে এই লিংক যাবে সে কোড দেখতে পাবে।</p><input id="lk2" readonly value="${esc(shareLink(true))}"><a id="wl2" class="btn" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareLink(true))}">হোয়াটসঅ্যাপে পাঠান</a> <button class="btn o" onclick="cpLink('lk2')">কপি</button> <a id="ol2" class="btn o" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${esc(shareLink(true))}">খুলে দেখুন</a></div><div class="card"><h2>হিসাব</h2><div class="row"><span>অনুমোদিত প্লেয়ার</span><b>${teams.length} জন</b></div><div class="row"><span>মোট সংগৃহীত</span><b>৳ ${(+S.fee||0)*teams.length}</b></div></div><div class="card"><h2>প্লেয়ার যোগ করুন</h2><input id="mn" placeholder="নাম"><input id="mp" type="tel" placeholder="হোয়াটসঅ্যাপ নম্বর"><button class="btn" onclick="addMan()">যোগ ও অনুমোদন</button></div><div class="card"><h2>মেসেজ থেকে যোগ করুন</h2><p class="mu">প্লেয়ারের পাঠ  if(isBr())h+=`<div class="card"><h2>ম্যাচ তালিকা</h2><button class="btn" onclick="genBracket()">ম্যাচ তালিকা তৈরি করুন (${teams.length} জন)</button>${S.bracket?' <button class="btn r" onclick="delBr()">ম্যাচ তালিকা মুছুন</button>':''}<p class="mu">তৈরির পর "ম্যাচ তালিকা" ট্যাবে বিজয়ীর নামে ট্যাপ করুন।</p></div>`;
 else h+=`<div class="card"><h2>ম্যাচের ফলাফল যোগ</h2><select id="pt">${teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select><input id="pm" type="number" min="1" placeholder="ম্যাচ নম্বর (১, ২, ৩…)"><input id="pp" type="number" min="1" max="12" placeholder="পজিশন (১–১২)"><input id="pk" type="number" min="0" placeholder="কিল"><button class="btn" onclick="addPts()">যোগ করুন</button>
 ${S.pts.slice().reverse().map(x=>`<div class="row"><span>ম্যাচ ${x.m} · ${esc(x.team)} · #${x.place} · ${x.kills} কিল = <b>${x.pts}</b></span><button class="btn s r" onclick="delPts(${x.id})">✕</button></div>`).join('')}</div>`;
 return h+`<div class="card"><h2>নিরাপত্তা</h2><input id="np" placeholder="নতুন পিন"><button class="btn o" onclick="chPin()">পিন বদলান</button> <button class="btn r" onclick="resetAll()">সব মুছুন</button> <button class="btn o" onclick="admin=false;render()">লগআউট</button></div>`}

function canAdm(){return ADMIN_BUILD}
function render(){if(tab==='adm'&&!canAdm())tab='reg';
 $('ttl').textContent='⚽ '+S.name+' ⚽';$('sub').textContent=S.sub||'';
 $('nav').innerHTML=[['reg','রেজিস্ট্রেশন'],['main','ম্যাচ তালিকা']].concat(canAdm()?[['adm','অ্যাডমিন']]:[]).map(([k,l])=>`<button class="${tab===k||(k==='reg'&&tab==='pay')?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('app').innerHTML=(tab==='reg'?vReg():tab==='pay'?vPay():tab==='main'?vMain():vAdmin())+(tab==='main'?helpBox():'')}
render();
if(typeof window.addEventListener==='function')window.addEventListener('hashchange',()=>{applyHash();render()});
</script>
</body>
</html>
